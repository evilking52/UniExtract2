name: aardio-package

on:
  push:
    branches:
      - refactor/aardio
    paths:
      - .github/workflows/aardio-package.yml
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Download official aardio package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://d.aardio.com/ide/aardio.7z' -OutFile 'aardio.7z'
          7z x aardio.7z -oaardio -y | Out-Null
          Get-ChildItem aardio -Recurse -File | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path aardio).Path.Length + 1)
            "$relative`t$($_.Length)"
          } | Set-Content aardio-inventory.txt -Encoding utf8

      - name: Upload package and inventory
        uses: actions/upload-artifact@v4
        with:
          name: aardio-official-package
          path: |
            aardio/**
            aardio-inventory.txt
          compression-level: 0
          if-no-files-found: error
