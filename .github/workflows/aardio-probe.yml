name: aardio-probe

on:
  push:
    branches:
      - refactor/aardio
    paths:
      - .github/workflows/aardio-probe.yml
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Download aardio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://d.aardio.com/ide/aardio.7z' -OutFile 'aardio.7z'
          7z x aardio.7z -oaardio -y | Out-Null
          $exe = (Get-ChildItem -Path aardio -Recurse -File | Where-Object { $_.Name -ieq 'aardio.exe' } | Select-Object -First 1).FullName
          if (-not $exe) { throw 'aardio.exe not found' }
          "AARDIO_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "aardio.exe=$exe" | Set-Content probe-summary.txt -Encoding utf8
          "version=$((Get-Item $exe).VersionInfo.FileVersion)" | Add-Content probe-summary.txt -Encoding utf8

      - name: Inspect executable strings
        shell: pwsh
        run: |
          @'
          import os,re
          path=os.environ['AARDIO_EXE']
          data=open(path,'rb').read()
          out=[]
          keys=('compile','publish','build','run','command','project','aproj','debug','script','execute','console','autos','invoke')
          seen=set()
          for raw in re.findall(rb'[\x20-\x7e]{5,}',data):
              s=raw.decode('latin1','ignore')
              low=s.lower()
              if any(k in low for k in keys) and s not in seen:
                  seen.add(s); out.append('ASCII '+s[:500])
          for m in re.finditer(rb'(?:[\x20-\x7e]\x00){5,}',data):
              try: s=m.group().decode('utf-16le')
              except: continue
              low=s.lower()
              if any(k in low for k in keys) and s not in seen:
                  seen.add(s); out.append('UTF16 '+s[:500])
          open('probe-summary.txt','a',encoding='utf-8').write('\n=== FILTERED STRINGS ===\n'+'\n'.join(out[:800])+'\n')
          '@ | Set-Content inspect.py -Encoding utf8
          python inspect.py

      - name: Probe command-line switches
        shell: pwsh
        run: |
          "`n=== SWITCH PROBE ===" | Add-Content probe-summary.txt -Encoding utf8
          $switches = @('/?','-?','--help','/help','-help','/version','-version','/compile','-compile','/run','-run','/publish','-publish','/build','-build')
          foreach ($sw in $switches) {
            "--- $sw ---" | Add-Content probe-summary.txt -Encoding utf8
            $out = Join-Path $PWD 'stdout.txt'
            $err = Join-Path $PWD 'stderr.txt'
            Remove-Item $out,$err -Force -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $env:AARDIO_EXE -ArgumentList $sw -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $timedOut = -not $p.WaitForExit(3000)
            if ($timedOut) { Stop-Process -Id $p.Id -Force; Start-Sleep -Milliseconds 300 }
            "timedOut=$timedOut exitCode=$($p.ExitCode)" | Add-Content probe-summary.txt -Encoding utf8
            if (Test-Path $out) { Get-Content $out | Add-Content probe-summary.txt -Encoding utf8 }
            if (Test-Path $err) { Get-Content $err | Add-Content probe-summary.txt -Encoding utf8 }
          }

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aardio-probe-report
          path: probe-summary.txt
          if-no-files-found: error
