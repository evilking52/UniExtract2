name: aardio-probe

on:
  push:
    branches:
      - refactor/aardio
    paths:
      - .github/workflows/aardio-probe.yml
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Download aardio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://d.aardio.com/ide/aardio.7z' -OutFile 'aardio.7z'
          7z x aardio.7z -oaardio -y | Out-Null
          $exe = (Get-ChildItem -Path aardio -Recurse -File | Where-Object { $_.Name -ieq 'aardio.exe' } | Select-Object -First 1).FullName
          if (-not $exe) { throw 'aardio.exe not found' }
          "AARDIO_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "aardio.exe=$exe" | Set-Content probe-summary.txt -Encoding utf8
          "version=$((Get-Item $exe).VersionInfo.FileVersion)" | Add-Content probe-summary.txt -Encoding utf8

      - name: Run aardio file through IDE command
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $PWD 'ci-smoke.aardio'
          $marker = Join-Path $PWD 'ci-smoke-result.txt'
          @'
          var file,err = io.open(io.fullpath("/ci-smoke-result.txt"),"wb");
          assert(file,err);
          file.write("AARDIO_F5_OK");
          file.close();
          '@ | Set-Content -Path $script -Encoding utf8

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeMethods {
              [DllImport("user32.dll", SetLastError=true)]
              public static extern bool PostMessage(IntPtr hWnd, uint Msg, IntPtr wParam, IntPtr lParam);
          }
          '@

          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $env:AARDIO_EXE
          $psi.WorkingDirectory = Split-Path $env:AARDIO_EXE
          $psi.UseShellExecute = $false
          $psi.ArgumentList.Add($script)
          $ide = [System.Diagnostics.Process]::Start($psi)
          Start-Sleep -Seconds 10
          $ide.Refresh()
          "pid=$($ide.Id) hwnd=$($ide.MainWindowHandle) title=$($ide.MainWindowTitle)" | Add-Content probe-summary.txt -Encoding utf8

          $all = Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq 'aardio.exe' }
          $all | Select-Object ProcessId,ParentProcessId,CommandLine | Format-List | Out-String | Add-Content probe-summary.txt -Encoding utf8

          if ($ide.MainWindowHandle -eq 0) { throw 'aardio IDE has no main window' }
          $posted = [NativeMethods]::PostMessage($ide.MainWindowHandle,0x0111,[IntPtr]33565,[IntPtr]0)
          "postRunCommand=$posted" | Add-Content probe-summary.txt -Encoding utf8

          $ok = $false
          for ($i=0; $i -lt 50; $i++) {
            if (Test-Path $marker) { $ok = $true; break }
            Start-Sleep -Milliseconds 500
          }
          "markerExists=$ok" | Add-Content probe-summary.txt -Encoding utf8
          if ($ok) { Get-Content $marker | Add-Content probe-summary.txt -Encoding utf8 }

          "`n=== final processes ===" | Add-Content probe-summary.txt -Encoding utf8
          Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq 'aardio.exe' } | Select-Object ProcessId,ParentProcessId,CommandLine | Format-List | Out-String | Add-Content probe-summary.txt -Encoding utf8
          "`n=== build logs ===" | Add-Content probe-summary.txt -Encoding utf8
          Get-ChildItem -Path $PWD,(Split-Path $env:AARDIO_EXE) -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'build.*error.*log|error.*log' } | ForEach-Object {
            "FILE=$($_.FullName)" | Add-Content probe-summary.txt -Encoding utf8
            Get-Content $_.FullName -ErrorAction SilentlyContinue | Add-Content probe-summary.txt -Encoding utf8
          }

          Get-Process | Where-Object { $_.ProcessName -match 'aardio|ci-smoke' } | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'aardio run command did not create the marker' }

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aardio-probe-report
          path: probe-summary.txt
          if-no-files-found: error
