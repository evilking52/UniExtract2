name: aardio-trigger-probe

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download aardio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://d.aardio.com/ide/aardio.7z' -OutFile "$env:RUNNER_TEMP\aardio.7z"
          7z x "$env:RUNNER_TEMP\aardio.7z" "-o$env:RUNNER_TEMP\aardio" -y | Out-Null
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\aardio" -Recurse -Filter aardio.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw 'aardio.exe not found' }
          "AARDIO_EXE=$exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inject startup trigger and run source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $PWD.Path
          $script = Join-Path $root 'trigger-smoke.aardio'
          $marker = Join-Path $root 'trigger-smoke-result.txt'
          $markerForAardio = $marker.Replace('\','/')
          @"
          var file,err = io.open("$markerForAardio","wb");
          assert(file,err);
          file.write("AARDIO_TRIGGER_OK");
          file.close();
          "@ | Set-Content $script -Encoding utf8

          $env:AARDIO_CI_TEST_SCRIPT = $script
          $env:AARDIO_CI_APP_ROOT = $root
          $initPath = Join-Path (Split-Path $env:AARDIO_EXE) 'extensions\trigger\init.aardio'
          $hook = @'
          var __ciScript = string.getenv("AARDIO_CI_TEST_SCRIPT");
          var __ciRoot = string.getenv("AARDIO_CI_APP_ROOT");
          if(__ciScript && __ciRoot){
              thread.invoke(function(scriptPath,appRoot){
                  import ide;
                  sleep(1500);
                  ide.createProcessEx(appRoot,,scriptPath);
              },__ciScript,__ciRoot);
          }
          '@
          $source = Get-Content $initPath -Raw
          if (-not $source.Contains('win.loopMessage();')) { throw 'trigger insertion point not found' }
          $source = $source.Replace('win.loopMessage();', $hook + "`r`nwin.loopMessage();")
          [System.IO.File]::WriteAllText($initPath,$source,[System.Text.UTF8Encoding]::new($false))

          $ide = Start-Process -FilePath $env:AARDIO_EXE -PassThru
          $ok = $false
          for ($i=0; $i -lt 120; $i++) {
              if (Test-Path $marker) { $ok = $true; break }
              if ($ide.HasExited) { break }
              Start-Sleep -Milliseconds 500
          }
          "idePid=$($ide.Id) exited=$($ide.HasExited) marker=$ok" | Set-Content trigger-probe-diagnostic.txt -Encoding utf8
          if (Test-Path $marker) { Get-Content $marker | Add-Content trigger-probe-diagnostic.txt -Encoding utf8 }
          Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq 'aardio.exe' } | Select-Object ProcessId,ParentProcessId,CommandLine | Format-List | Out-String | Add-Content trigger-probe-diagnostic.txt -Encoding utf8
          if (-not $ok) { throw 'startup trigger did not execute source' }

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aardio-trigger-probe
          path: |
            trigger-probe-diagnostic.txt
            trigger-smoke-result.txt
          if-no-files-found: ignore

      - name: Stop aardio
        if: always()
        shell: pwsh
        run: |
          Get-Process aardio -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
