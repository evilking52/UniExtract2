name: aardio-ci

on:
  push:
    branches:
      - refactor/aardio
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download aardio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://d.aardio.com/ide/aardio.7z' -OutFile "$env:RUNNER_TEMP\aardio.7z"
          7z x "$env:RUNNER_TEMP\aardio.7z" "-o$env:RUNNER_TEMP\aardio" -y | Out-Null
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\aardio" -Recurse -Filter aardio.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw 'aardio.exe not found' }
          "AARDIO_EXE=$exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run aardio tests through startup trigger
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appRoot = $PWD.Path
          $testScript = (Resolve-Path 'tests\run.aardio').Path
          $resultPath = Join-Path $appRoot 'aardio-test-result.txt'
          $diagnosticPath = Join-Path $appRoot 'aardio-ci-diagnostic.txt'
          Remove-Item $resultPath,$diagnosticPath -Force -ErrorAction SilentlyContinue

          $env:AARDIO_TEST_RESULT = $resultPath
          $env:AARDIO_CI_TEST_SCRIPT = $testScript
          $env:AARDIO_CI_APP_ROOT = $appRoot

          $initPath = Join-Path (Split-Path $env:AARDIO_EXE) 'extensions\trigger\init.aardio'
          $hook = @'
          var __ciScript = string.getenv("AARDIO_CI_TEST_SCRIPT");
          var __ciRoot = string.getenv("AARDIO_CI_APP_ROOT");
          if(__ciScript && __ciRoot){
              thread.invoke(function(scriptPath,appRoot){
                  import ide;
                  sleep(1500);
                  ide.createProcessEx(appRoot,,scriptPath);
              },__ciScript,__ciRoot);
          }
          '@
          $source = Get-Content $initPath -Raw
          if (-not $source.Contains('win.loopMessage();')) { throw 'trigger insertion point not found' }
          $source = $source.Replace('win.loopMessage();', $hook + "`r`nwin.loopMessage();")
          [System.IO.File]::WriteAllText($initPath,$source,[System.Text.UTF8Encoding]::new($false))

          $ide = Start-Process -FilePath $env:AARDIO_EXE -PassThru
          $ok = $false
          for ($i=0; $i -lt 120; $i++) {
              if (Test-Path $resultPath) { $ok = $true; break }
              if ($ide.HasExited) { break }
              Start-Sleep -Milliseconds 500
          }

          "idePid=$($ide.Id) exited=$($ide.HasExited) marker=$ok" | Set-Content $diagnosticPath -Encoding utf8
          Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq 'aardio.exe' } | Select-Object ProcessId,ParentProcessId,CommandLine | Format-List | Out-String | Add-Content $diagnosticPath -Encoding utf8

          if (-not $ok) { throw 'aardio tests did not create AARDIO_TEST_RESULT' }
          $result = (Get-Content $resultPath -Raw).Trim()
          "result=$result" | Add-Content $diagnosticPath -Encoding utf8
          if ($result -ne 'PASS') { throw "aardio tests returned $result" }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aardio-ci-diagnostics
          path: |
            aardio-ci-diagnostic.txt
            aardio-test-result.txt
          if-no-files-found: ignore

      - name: Stop aardio processes
        if: always()
        shell: pwsh
        run: |
          Get-Process aardio -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
